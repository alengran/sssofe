<body>
    <!-- 顶部导航栏 -->

            <a href="contact.html" class="nav-item">联系我们</a>

    <div class="download-container">
        <!-- 返回按钮 -->
        <a href="index.html" class="back-button">
            <span>←</span> 返回软件列表
        </a>

        <!-- 软件详情区域 -->
        <div id="softwareDetail">
            <!-- 内容将通过JavaScript动态加载 -->
        </div>
    </div>

    <footer>
        <p class="copyright-info">© 2026 <a href="https://space.bilibili.com/595098830" target="_blank" style="color: #ffffff; text-decoration: none;">@电脑小百科</a> （抖音/B站/小红书）技术支持QQ：2591735711 软件精选 · All Rights Reserved</p>
    </footer>

    <script src="software-data.js"></script>
    <script>
        // 获取URL参数
        function getUrlParameter(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // 复制提取码
        function copyCode(code, button) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = '已复制';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 2000);
                });
            } else {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = code;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();

                try {
                    document.execCommand('copy');
                    button.textContent = '已复制';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = '复制';
                        button.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                }

                document.body.removeChild(textArea);
            }
        }

        // 设置页面meta标签
        function setPageMeta(software) {
            // 更新页面标题
            document.title = `${software.name} 下载 - 电脑小百科-软件精选`;

            // 更新关键词
            const keywords = `${software.name},${software.category},软件下载,绿色软件,免费软件,${software.name}下载`;
            const keywordsMeta = document.querySelector('meta[name="keywords"]');
            if (keywordsMeta) {
                keywordsMeta.setAttribute('content', keywords);
            }

            // 更新描述
            const description = `${software.name} - ${software.description}。提供${software.name}免费下载，绿色安全无捆绑，来自电脑小百科软件精选。`;
            const descriptionMeta = document.querySelector('meta[name="description"]');
            if (descriptionMeta) {
                descriptionMeta.setAttribute('content', description);
            }

            // 调试输出
            console.log('页面标题已更新:', document.title);
            console.log('关键词已更新:', keywords);
            console.log('描述已更新:', description);
        }

        // 渲染软件详情
        function renderSoftwareDetail(software) {
            // 设置页面meta信息
            setPageMeta(software);

            const container = document.getElementById('softwareDetail');

            const platformIcons = {
                'baidu': '☁️',
                'aliyun': '☁️',
                'lanzou': '🔗',
                'quark': '☁️',
                '123pan': '☁️',
                'xunlei': '⚡'
            };

            const platformNames = {
                'baidu': '百度网盘',
                'aliyun': '阿里云盘',
                'lanzou': '蓝奏云',
                'quark': '夸克网盘',
                '123pan': '123云盘',
                'xunlei': '迅雷网盘'
            };

            // 检查是否有下载链接
            const hasDownloads = software.downloadLinks && Object.keys(software.downloadLinks).length > 0;

            let downloadHTML = '';
            if (hasDownloads) {
                Object.entries(software.downloadLinks).forEach(([platform, info]) => {
                    downloadHTML += `
                        <div class="download-card">
                            <div class="platform-name">
                                <span class="platform-icon">${platformIcons[platform] || '🔗'}</span>
                                ${platformNames[platform] || platform}
                            </div>
                            <a href="${info.url}" target="_blank" class="download-link">
                                点击下载
                            </a>
                            ${info.code ? `
                                <div class="access-code">
                                    <span class="code-text">提取码: <strong>${info.code}</strong></span>
                                    <button class="copy-button" onclick="copyCode('${info.code}', this)">复制</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            } else {
                downloadHTML = `
                    <div class="no-downloads">
                        <div class="no-downloads-text">暂无下载链接，请联系管理员获取</div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="software-header">
                    <span class="software-icon-large">${software.icon || '📦'}</span>
                    <h1 class="software-title">${software.name}</h1>
                    <div class="software-category">${software.category}</div>
                    <p class="software-description">${software.description}</p>
                </div>

                <div class="download-section">
                    <h2 class="section-title">📥 下载地址</h2>
                    ${downloadHTML}
                </div>
            `;
        }

        // 显示加载状态
        function showLoading() {
            const container = document.getElementById('softwareDetail');
            container.innerHTML = `
                <div class="loading-state">
                    <div class="loading-icon">⏳</div>
                    <div>正在加载软件信息...</div>
                </div>
            `;
        }

        // 显示错误状态
        function showError(message) {
            const container = document.getElementById('softwareDetail');
            container.innerHTML = `
                <div class="error-state">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">加载失败</div>
                    <div class="error-text">${message}</div>
                </div>
            `;
        }

        // 初始化页面
        async function init() {
            try {
                showLoading();

                // 获取软件ID
                const softwareId = getUrlParameter('id');
                if (!softwareId) {
                    showError('未指定软件ID');
                    return;
                }

                // 加载数据
                const data = await dataManager.loadData();
                const software = data.find(s => s.id == softwareId);

                if (!software) {
                    showError('未找到指定的软件');
                    return;
                }

                // 立即设置页面meta信息（在渲染内容之前）
                setPageMeta(software);

                // 渲染软件详情
                renderSoftwareDetail(software);

            } catch (error) {
                console.error('加载软件详情失败:', error);
                showError('加载数据时发生错误，请稍后重试');
            }
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
