<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑小百科-软件精选 - 优质软件推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        header {
            text-align: center;
            padding: 80px 0 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
        }

        .logo {
            font-size: 48px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 20px rgba(255,255,255,0.1);
        }

        .tagline {
            font-size: 21px;
            color: #86868b;
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 20px;
            border: none;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            font-size: 17px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #searchInput:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #searchInput::placeholder {
            color: #86868b;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868b;
            font-size: 18px;
            pointer-events: none;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .filter-tab:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        .filter-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .software-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 80px;
            max-width: 1000px;
            margin-left: auto;
            margin-right: auto;
        }

        .software-card {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 20px 24px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .software-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            border-radius: 12px;
        }

        .software-card:hover {
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            transform: translateX(4px);
        }

        .software-card:hover::before {
            opacity: 1;
        }

        .software-number {
            min-width: 48px;
            height: 48px;
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: 700;
            flex-shrink: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            letter-spacing: 0.5px;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            position: relative;
            z-index: 1;
        }

        .app-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            margin-right: 16px;
            background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 2px 12px rgba(0,0,0,0.3);
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-category {
            font-size: 14px;
            color: #86868b;
            font-weight: 500;
        }

        .card-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .app-description {
            font-size: 15px;
            color: #d1d1d6;
            line-height: 1.5;
            margin-bottom: 0;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            position: relative;
            z-index: 1;
        }

        .download-buttons {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 1;
        }

        .download-btn {
            height: 36px;
            padding: 0 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .primary-btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .primary-btn:hover {
            background: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(255,255,255,0.1);
        }

        .no-results {
            text-align: center;
            padding: 100px 20px;
            color: #86868b;
        }

        .no-results-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results-text {
            font-size: 19px;
            font-weight: 500;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(28,28,30,0.95);
            border-radius: 24px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 100px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            color: #ffffff;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            padding-right: 50px;
        }

        .modal-icon {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            margin-right: 24px;
            background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .modal-title-group {
            flex: 1;
            min-width: 0;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .modal-category {
            font-size: 17px;
            color: #86868b;
            font-weight: 500;
        }

        .modal-description {
            font-size: 19px;
            color: #d1d1d6;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .download-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .download-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .download-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }

        .platform-name {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .download-link {
            display: block;
            padding: 14px 24px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            text-align: center;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .download-link:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-1px);
        }

        .access-code {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .code-text {
            color: #d1d1d6;
            font-weight: 500;
        }

        .copy-button {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-button:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }

        /* 底部简洁设计 */
        footer {
            text-align: center;
            padding: 50px 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: #000000;
        }

        /* 版权信息优雅卡片设计 */
        .copyright-info {
            display: inline-block;
            background: rgba(44, 44, 46, 0.8);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
        }

        .footer-link {
            color: #86868b;
            text-decoration: none;
            margin: 0 16px;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            header {
                padding: 60px 0 40px;
            }

            .logo {
                font-size: 32px;
            }

            .tagline {
                font-size: 16px;
            }

            .software-card {
                flex-direction: row;
                align-items: center;
                gap: 12px;
                padding: 12px 16px;
            }

            .software-number {
                min-width: 32px;
                height: 32px;
                font-size: 14px;
            }

            .card-header {
                margin-bottom: 4px;
            }

            .app-icon {
                width: 36px;
                height: 36px;
                font-size: 18px;
                margin-right: 10px;
            }

            .app-name {
                font-size: 15px;
            }

            .app-description {
                font-size: 13px;
                -webkit-line-clamp: 2;
                margin-bottom: 0;
            }

            .card-content {
                flex: 1;
                min-width: 0;
            }

            .download-buttons {
                width: auto;
            }

            .download-btn {
                padding: 8px 12px;
                font-size: 13px;
            }

            .modal-content {
                padding: 32px 28px;
            }

            .modal-icon {
                width: 72px;
                height: 72px;
                font-size: 36px;
            }

            .modal-title {
                font-size: 26px;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Loading state styles */
        .loading-spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Load more button */
        #loadMoreBtn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.25);
            transform: translateY(-2px);
        }

        #loadMoreBtn:active {
            transform: translateY(0);
        }

        /* Performance optimization: 硬件加速 */
        .filter-tab,
        .download-btn {
            will-change: transform;
        }

        .filter-tab:hover,
        .download-btn:hover {
            will-change: auto;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Loading animation - 极速加载 */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(3px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .software-card {
            animation: fadeInUp 0.15s ease-out forwards;
            opacity: 0;
        }

        /* 即时显示，几乎无延迟 */
        .software-card:nth-child(n+1) { animation-delay: 0.01s; }

        /* Subtle glow effect */
        .software-card::after {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05), rgba(255,255,255,0.1));
            border-radius: 12px;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: -1;
        }

        .software-card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">电脑小百科-软件精选 </div>
            <div class="tagline">绿色安全/无捆绑/ 提升工作效率</div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="搜索软件...">
                <span class="search-icon">🔍</span>
            </div>
            <div style="text-align: center; color: #86868b; font-size: 14px; margin-bottom: 40px; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 0 10px rgba(0, 0, 0, 0.3);">
                首次访问列表加载缓慢请稍后.....
            </div>
        </header>

        <div class="filter-tabs" id="categoryFilters"></div>

        <div class="software-list" id="softwareGrid"></div>

        <footer>
            <p class="copyright-info">© 2026 <a href="https://space.bilibili.com/595098830" target="_blank" style="color: #ffffff; text-decoration: none;">@电脑小百科</a> （抖音/B站/小红书）技术支持QQ：2591735711 软件精选 · All Rights Reserved</p>
        </footer>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title-group">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-category" id="modalCategory"></div>
                </div>
            </div>
            <p class="modal-description" id="modalDescription"></p>
            <div class="download-section" id="modalDownloads"></div>
        </div>
    </div>

    <script src="software-data.js"></script>
    <script>
        let allCategories = ['全部'];
        let currentFilter = '全部';
        let searchTerm = '';
        let currentPage = 1;
        const pageSize = 10;
        let allSoftwareData = [];
        let isLoading = false;

        // 初始化页面 - 极速加载模式
        function init() {
            try {
                // 不显示加载状态，直接渲染，提升感知速度
                dataManager.loadData().then(data => {
                    allSoftwareData = data;
                    allCategories = ['全部', ...new Set(data.map(item => item.category))];

                    // 立即渲染
                    renderCategories();
                    renderSoftware();
                    setupEventListeners();
                });
            } catch (error) {
                console.error('数据加载失败:', error);
                showErrorState();
            }
        }

        // 显示加载状态
        function showLoadingState() {
            const container = document.getElementById('softwareGrid');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #86868b;">
                    <div style="font-size: 48px; margin-bottom: 20px;">⏳</div>
                    <div style="font-size: 18px;">数据正在加载，请稍后</div>
                </div>
            `;
        }

        // 隐藏加载状态
        function hideLoadingState() {
            // 数据加载完成后，渲染会自动替换加载状态
        }

        // 显示错误状态
        function showErrorState() {
            const container = document.getElementById('softwareGrid');
            container.innerHTML = `
                <div style="text-align: center; padding: 60px 20px; color: #ff6b6b;">
                    <div style="font-size: 48px; margin-bottom: 20px;">⚠️</div>
                    <div style="font-size: 18px; margin-bottom: 20px;">数据加载失败</div>
                    <button onclick="init()" style="padding: 12px 24px; background: #ffffff; color: #000000; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;">
                        重新加载
                    </button>
                </div>
            `;
        }

        // 渲染分类标签
        function renderCategories() {
            const container = document.getElementById('categoryFilters');

            // 渲染标签
            container.innerHTML = allCategories.map(category =>
                `<button class="filter-tab ${category === '全部' ? 'active' : ''}"
                        onclick="filterByCategory('${category}')">${category}</button>`
            ).join('');
        }

        // 渲染软件卡片（支持分页）
        function renderSoftware() {
            if (isLoading) return;

            const container = document.getElementById('softwareGrid');
            let filteredData = [...allSoftwareData];

            // 分类筛选
            if (currentFilter !== '全部') {
                filteredData = filteredData.filter(s => s.category === currentFilter);
            }

            // 搜索筛选
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredData = filteredData.filter(s =>
                    s.name.toLowerCase().includes(term) ||
                    s.description.toLowerCase().includes(term)
                );
            }

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">没有找到匹配的软件</div>
                    </div>
                `;
                return;
            }

            // 分页处理
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const hasMore = currentPage < totalPages;

            container.innerHTML = pageData.map((software) => {
                // 直接使用软件对象中的固定序号
                return `
                <div class="software-card" onclick="showDetail('${software.id}')">
                    <div class="software-number">${software.index}</div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="app-icon">${software.icon || '📦'}</div>
                            <div class="app-info">
                                <div class="app-name">${software.name}</div>
                            </div>
                        </div>
                        <div class="app-description">${software.description}</div>
                    </div>
                    <div class="download-buttons">
                        ${Object.keys(software.downloadLinks || {}).length > 0 ?
                            `<button class="download-btn primary-btn" onclick="event.stopPropagation(); showDetail('${software.id}')">
                                立即下载
                            </button>` : ''
                        }
                    </div>
                </div>
                `;
            }).join('');

            // 添加"加载更多"按钮
            if (hasMore) {
                container.innerHTML += `
                    <div style="text-align: center; margin-top: 32px;">
                        <button id="loadMoreBtn" onclick="loadMore()" style="padding: 14px 32px; background: rgba(255,255,255,0.08); color: #ffffff; border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: 600; transition: all 0.3s;">
                            加载更多 (${currentPage}/${totalPages}页)
                        </button>
                    </div>
                `;
            }

            // 显示统计信息
            const statsInfo = document.createElement('div');
            statsInfo.style.cssText = 'text-align: center; color: #86868b; font-size: 14px; margin-top: 24px;';
            statsInfo.textContent = `显示 ${start + 1}-${Math.min(end, filteredData.length)} 条，共 ${filteredData.length} 条`;
            container.appendChild(statsInfo);
        }

        // 加载更多数据
        function loadMore() {
            currentPage++;
            renderSoftware();
        }

        // 分类筛选
        function filterByCategory(category) {
            currentFilter = category;
            currentPage = 1; // 重置页码

            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === category) {
                    tab.classList.add('active');
                }
            });

            renderSoftware();
        }

        // 显示详情
        function showDetail(softwareId) {
            // 确保数据已加载
            if (!allSoftwareData || allSoftwareData.length === 0) {
                console.error('数据未加载，无法显示详情');
                return;
            }

            const software = allSoftwareData.find(s => s.id == softwareId);
            if (!software) {
                console.error('未找到软件，ID:', softwareId);
                return;
            }

            document.getElementById('modalIcon').textContent = software.icon || '📦';
            document.getElementById('modalTitle').textContent = software.name;
            document.getElementById('modalCategory').textContent = software.category;
            document.getElementById('modalDescription').textContent = software.description;

            // 渲染下载链接
            const downloadsContainer = document.getElementById('modalDownloads');
            let html = '';

            // 立即下载
            if (software.downloadLinks && Object.keys(software.downloadLinks).length > 0) {
                html += '<div class="download-section"><div class="section-title">立即下载</div>';

                const platformNames = {
                    'baidu': '百度网盘',
                    'aliyun': '阿里云盘',
                    'lanzou': '蓝奏云',
                    'quark': '夸克网盘',
                    '123pan': '123云盘',
                    'xunlei': '迅雷网盘'
                };

                Object.entries(software.downloadLinks).forEach(([platform, info]) => {
                    html += `
                        <div class="download-card">
                            <div class="platform-name">${platformNames[platform] || platform}</div>
                            <a href="${info.url}" target="_blank" class="download-link">
                                点击下载
                            </a>
                            ${info.code ? `
                                <div class="access-code">
                                    <span class="code-text">提取码: ${info.code}</span>
                                    <button class="copy-button" onclick="copyCode('${info.code}', this)">复制</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += '</div>';
            }

            if (!html) {
                html = '<div class="download-section"><p style="color: #86868b; text-align: center;">暂无下载链接</p></div>';
            }

            downloadsContainer.innerHTML = html;

            // 确保弹窗正确显示（Edge浏览器兼容性修复）
            const modal = document.getElementById('detailModal');
            if (modal) {
                modal.style.display = 'flex';
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';

                // 强制重绘，确保样式生效
                setTimeout(() => {
                    modal.offsetHeight;
                }, 10);
            } else {
                console.error('未找到弹窗元素');
            }
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('detailModal');
            if (modal) {
                // 同时重置样式和CSS类（Edge浏览器兼容性修复）
                modal.style.display = 'none';
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // 复制提取码
        function copyCode(code, button) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = '已复制';
                    setTimeout(() => button.textContent = originalText, 2000);
                });
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索功能（添加防抖）
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchTerm = e.target.value;
                    currentPage = 1; // 重置页码
                    renderSoftware();
                }, 300); // 300ms防抖
            });

            // 点击弹窗外部关闭
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    closeModal();
                }
            });

            // ESC 键关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
