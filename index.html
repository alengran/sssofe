<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电脑小百科-软件精选 - 优质软件推荐</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Icons", "Helvetica Neue", "Helvetica", "Arial", sans-serif;
            background: #000000;
            color: #ffffff;
            line-height: 1.47059;
            font-weight: 400;
            letter-spacing: -0.022em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 30px;
        }

        header {
            text-align: center;
            padding: 80px 0 60px;
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.6) 100%);
        }

        .logo {
            font-size: 48px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
            letter-spacing: -0.03em;
            text-shadow: 0 2px 20px rgba(255,255,255,0.1);
        }

        .tagline {
            font-size: 21px;
            color: #86868b;
            font-weight: 400;
            margin-bottom: 40px;
            letter-spacing: -0.01em;
        }

        .search-container {
            max-width: 600px;
            margin: 0 auto 50px;
            position: relative;
        }

        #searchInput {
            width: 100%;
            height: 48px;
            padding: 0 48px 0 20px;
            border: none;
            border-radius: 24px;
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            font-size: 17px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            outline: none;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #searchInput:focus {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        #searchInput::placeholder {
            color: #86868b;
        }

        .search-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #86868b;
            font-size: 18px;
            pointer-events: none;
        }

        .filter-tabs {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 50px;
            flex-wrap: wrap;
        }

        .filter-tab {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        .filter-tab:hover {
            background: rgba(255,255,255,0.1);
            border-color: rgba(255,255,255,0.2);
        }

        .filter-tab.active {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        .software-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(280px, 320px));
            gap: 24px;
            margin-bottom: 80px;
            justify-content: center;
        }

        @media (max-width: 1400px) {
            .software-grid {
                grid-template-columns: repeat(3, minmax(280px, 320px));
            }
        }

        @media (max-width: 1100px) {
            .software-grid {
                grid-template-columns: repeat(2, minmax(280px, 320px));
            }
        }

        .software-card {
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.08);
            transition: all 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .software-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            opacity: 0;
            transition: opacity 0.4s;
            pointer-events: none;
        }

        .software-card:hover {
            transform: translateY(-8px);
            background: rgba(255,255,255,0.06);
            border-color: rgba(255,255,255,0.15);
            box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 1px rgba(255,255,255,0.1);
        }

        .software-card:hover::before {
            opacity: 1;
        }

        .software-number {
            position: absolute;
            top: 16px;
            left: 16px;
            min-width: 24px;
            height: 24px;
            background: rgba(255,255,255,0.15);
            color: #ffffff;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 600;
            z-index: 10;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 0 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
            letter-spacing: 0.3px;
        }

        .card-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            margin-right: 20px;
            background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .app-info {
            flex: 1;
            min-width: 0;
        }

        .app-name {
            font-size: 19px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .app-category {
            font-size: 14px;
            color: #86868b;
            font-weight: 500;
        }

        .app-description {
            font-size: 16px;
            color: #d1d1d6;
            line-height: 1.5;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            min-height: 72px;
            position: relative;
            z-index: 1;
        }

        .download-buttons {
            display: flex;
            gap: 12px;
            position: relative;
            z-index: 1;
            justify-content: center;
        }

        .download-btn {
            width: 100px;
            height: 44px;
            padding: 0 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
        }

        .primary-btn {
            background: #ffffff;
            color: #000000;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .primary-btn:hover {
            background: rgba(255,255,255,0.9);
            border-color: rgba(255,255,255,0.3);
            box-shadow: 0 8px 32px rgba(255,255,255,0.1);
        }

        .secondary-btn {
            background: rgba(255,255,255,0.08);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .secondary-btn:hover {
            background: rgba(255,255,255,0.15);
            border-color: rgba(255,255,255,0.25);
        }

        .no-results {
            text-align: center;
            padding: 100px 20px;
            color: #86868b;
        }

        .no-results-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .no-results-text {
            font-size: 19px;
            font-weight: 500;
        }

        /* Modal styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: rgba(28,28,30,0.95);
            border-radius: 24px;
            padding: 40px;
            max-width: 560px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 30px 100px rgba(0,0,0,0.8), 0 0 1px rgba(255,255,255,0.1);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
        }

        .modal-close {
            position: absolute;
            top: 24px;
            right: 24px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.15);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            color: #ffffff;
        }

        .modal-close:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.25);
        }

        .modal-header {
            display: flex;
            align-items: center;
            margin-bottom: 32px;
            padding-right: 50px;
        }

        .modal-icon {
            width: 88px;
            height: 88px;
            border-radius: 22px;
            margin-right: 24px;
            background: linear-gradient(135deg, #2c2c2e 0%, #1c1c1e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 44px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        .modal-title-group {
            flex: 1;
            min-width: 0;
        }

        .modal-title {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.1;
            letter-spacing: -0.02em;
        }

        .modal-category {
            font-size: 17px;
            color: #86868b;
            font-weight: 500;
        }

        .modal-description {
            font-size: 19px;
            color: #d1d1d6;
            line-height: 1.6;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .download-section {
            margin-bottom: 28px;
        }

        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 16px;
            letter-spacing: -0.01em;
        }

        .download-card {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .download-card:hover {
            background: rgba(255,255,255,0.08);
            border-color: rgba(255,255,255,0.15);
        }

        .platform-name {
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 12px;
        }

        .download-link {
            display: block;
            padding: 14px 24px;
            background: #ffffff;
            color: #000000;
            text-decoration: none;
            text-align: center;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .download-link:hover {
            background: rgba(255,255,255,0.9);
            transform: translateY(-1px);
        }

        .access-code {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            font-size: 15px;
            border: 1px solid rgba(255,255,255,0.08);
        }

        .code-text {
            color: #d1d1d6;
            font-weight: 500;
        }

        .copy-button {
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border: 1px solid rgba(255,255,255,0.2);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-button:hover {
            background: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.3);
        }

        /* 底部简洁设计 */
        footer {
            text-align: center;
            padding: 50px 20px;
            margin-top: 40px;
            border-top: 1px solid rgba(255,255,255,0.1);
            background: #000000;
        }

        /* 版权信息优雅卡片设计 */
        .copyright-info {
            display: inline-block;
            background: rgba(44, 44, 46, 0.8);
            color: #ffffff;
            padding: 16px 24px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15);
            font-size: 14px;
            font-weight: 500;
            line-height: 1.5;
            text-align: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            letter-spacing: 0.3px;
        }

        .footer-link {
            color: #86868b;
            text-decoration: none;
            margin: 0 16px;
            transition: color 0.2s;
        }

        .footer-link:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 20px;
            }

            header {
                padding: 60px 0 40px;
            }

            .logo {
                font-size: 40px;
            }

            .tagline {
                font-size: 18px;
            }

            .software-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .software-card {
                padding: 20px;
            }

            .software-number {
                min-width: 22px;
                height: 22px;
                font-size: 12px;
                top: 14px;
                left: 14px;
                padding: 0 6px;
            }

            .download-buttons {
                flex-direction: column;
                gap: 10px;
            }

            .download-btn {
                width: 100%;
            }

            .modal-content {
                padding: 32px 28px;
            }

            .modal-icon {
                width: 72px;
                height: 72px;
                font-size: 36px;
            }

            .modal-title {
                font-size: 26px;
            }
        }

        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #000000;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 5px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255,255,255,0.3);
        }

        /* Loading animation */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .software-card {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
        }

        .software-card:nth-child(1) { animation-delay: 0.1s; }
        .software-card:nth-child(2) { animation-delay: 0.2s; }
        .software-card:nth-child(3) { animation-delay: 0.3s; }
        .software-card:nth-child(4) { animation-delay: 0.4s; }
        .software-card:nth-child(5) { animation-delay: 0.5s; }
        .software-card:nth-child(6) { animation-delay: 0.6s; }
        .software-card:nth-child(7) { animation-delay: 0.7s; }
        .software-card:nth-child(8) { animation-delay: 0.8s; }
        .software-card:nth-child(9) { animation-delay: 0.9s; }
        .software-card:nth-child(10) { animation-delay: 1.0s; }
        .software-card:nth-child(11) { animation-delay: 1.1s; }
        .software-card:nth-child(12) { animation-delay: 1.2s; }

        /* Subtle glow effect */
        .software-card::after {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05), rgba(255,255,255,0.1));
            border-radius: 20px;
            opacity: 0;
            transition: opacity 0.4s;
            z-index: -1;
        }

        .software-card:hover::after {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">电脑小百科-软件精选 </div>
            <div class="tagline">绿色安全/无捆绑/ 提升工作效率</div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="搜索软件...">
                <span class="search-icon">🔍</span>
            </div>
        </header>

        <div class="filter-tabs" id="categoryFilters"></div>

        <div class="software-grid" id="softwareGrid"></div>

        <footer>
            <p class="copyright-info">© 2026 @电脑小百科 （抖音/B站/小红书）软件精选 · All Rights Reserved</p>
        </footer>
    </div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title-group">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-category" id="modalCategory"></div>
                </div>
            </div>
            <p class="modal-description" id="modalDescription"></p>
            <div class="download-section" id="modalDownloads"></div>
        </div>
    </div>

    <script src="software-data.js"></script>
    <script>
        let allCategories = ['全部'];
        let currentFilter = '全部';
        let searchTerm = '';

        // 初始化页面
        function init() {
            renderCategories();
            renderSoftware();
            setupEventListeners();
        }

        // 渲染分类标签
        function renderCategories() {
            const container = document.getElementById('categoryFilters');

            // 收集所有分类
            softwareData.forEach(software => {
                if (!allCategories.includes(software.category)) {
                    allCategories.push(software.category);
                }
            });

            // 渲染标签
            container.innerHTML = allCategories.map(category =>
                `<button class="filter-tab ${category === '全部' ? 'active' : ''}"
                        onclick="filterByCategory('${category}')">${category}</button>`
            ).join('');
        }

        // 渲染软件卡片
        function renderSoftware() {
            const container = document.getElementById('softwareGrid');
            let filteredData = softwareData;

            // 分类筛选
            if (currentFilter !== '全部') {
                filteredData = filteredData.filter(s => s.category === currentFilter);
            }

            // 搜索筛选
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                filteredData = filteredData.filter(s =>
                    s.name.toLowerCase().includes(term) ||
                    s.description.toLowerCase().includes(term)
                );
            }

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">没有找到匹配的软件</div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredData.map((software) => {
                // 在原始数组中查找该软件的全局序号
                const globalIndex = softwareData.findIndex(s => s.id === software.id);

                return `
                <div class="software-card" onclick="showDetail('${software.id}')">
                    <div class="software-number">${globalIndex + 1}</div>
                    <div class="card-header">
                        <div class="app-icon">${software.icon || '📦'}</div>
                        <div class="app-info">
                            <div class="app-name">${software.name}</div>
                            <div class="app-category">${software.category}</div>
                        </div>
                    </div>
                    <div class="app-description">${software.description}</div>
                    <div class="download-buttons">
                        ${Object.keys(software.downloadLinks || {}).length > 0 ?
                            `<button class="download-btn primary-btn" onclick="event.stopPropagation(); showDetail('${software.id}')">
                                立即下载
                            </button>` : ''
                        }
                    </div>
                </div>
                `;
            }).join('');
        }

        // 分类筛选
        function filterByCategory(category) {
            currentFilter = category;

            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === category) {
                    tab.classList.add('active');
                }
            });

            renderSoftware();
        }

        // 显示详情
        function showDetail(softwareId) {
            const software = softwareData.find(s => s.id === softwareId);
            if (!software) return;

            document.getElementById('modalIcon').textContent = software.icon || '📦';
            document.getElementById('modalTitle').textContent = software.name;
            document.getElementById('modalCategory').textContent = software.category;
            document.getElementById('modalDescription').textContent = software.description;

            // 渲染下载链接
            const downloadsContainer = document.getElementById('modalDownloads');
            let html = '';

            // 立即下载
            if (software.downloadLinks && Object.keys(software.downloadLinks).length > 0) {
                html += '<div class="download-section"><div class="section-title">立即下载</div>';

                const platformNames = {
                    'baidu': '百度网盘',
                    'aliyun': '阿里云盘',
                    'lanzou': '蓝奏云',
                    'quark': '夸克网盘',
                    '123pan': '123云盘',
                    'xunlei': '迅雷网盘'
                };

                Object.entries(software.downloadLinks).forEach(([platform, info]) => {
                    html += `
                        <div class="download-card">
                            <div class="platform-name">${platformNames[platform] || platform}</div>
                            <a href="${info.url}" target="_blank" class="download-link">
                                点击下载
                            </a>
                            ${info.code ? `
                                <div class="access-code">
                                    <span class="code-text">提取码: ${info.code}</span>
                                    <button class="copy-button" onclick="copyCode('${info.code}', this)">复制</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += '</div>';
            }

            if (!html) {
                html = '<div class="download-section"><p style="color: #86868b; text-align: center;">暂无下载链接</p></div>';
            }

            downloadsContainer.innerHTML = html;
            document.getElementById('detailModal').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        // 关闭弹窗
        function closeModal() {
            document.getElementById('detailModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        // 复制提取码
        function copyCode(code, button) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = '已复制';
                    setTimeout(() => button.textContent = originalText, 2000);
                });
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索功能
            document.getElementById('searchInput').addEventListener('input', (e) => {
                searchTerm = e.target.value;
                renderSoftware();
            });

            // 点击弹窗外部关闭
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    closeModal();
                }
            });

            // ESC 键关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
