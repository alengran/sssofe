    <div class="main">

        <div class="container">

</div>

    <!-- 详情弹窗 -->
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div class="modal-header">
                <div class="modal-icon" id="modalIcon"></div>
                <div class="modal-title-group">
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-category" id="modalCategory"></div>
                </div>
            </div>
            <p class="modal-description" id="modalDescription"></p>
            <div class="download-section" id="modalDownloads"></div>
        </div>
    </div>

    <script src="site.js"></script>
    <script src="nav.js"></script>
    <script src="software-data.js"></script>
    <script>
        let allCategories = ['全部'];
        let currentFilter = '全部';
        let searchTerm = '';
        let currentPage = 1;
        const pageSize = 15;
        let allSoftwareData = [];
        let isLoading = false;

        // DOM引用缓存 - 减少重复查询
        const domCache = {
            categoryFilters: null,
            softwareGrid: null,
            searchInput: null,
            detailModal: null,
            modalIcon: null,
            modalTitle: null,
            modalCategory: null,
            modalDescription: null,
            modalDownloads: null
        };

        // 初始化页面 - 极速加载模式
        function init() {
            try {
                // 初始化DOM引用缓存
                initDOMCache();

                // 不显示加载状态，直接渲染，提升感知速度
                dataManager.loadData().then(data => {
                    allSoftwareData = data;
                    allCategories = ['全部', ...new Set(data.map(item => item.category))];

                    // 读取侧栏分类导航带来的 ?cat= 参数
                    const catParam = new URLSearchParams(location.search).get('cat');
                    if (catParam && allCategories.includes(catParam)) {
                        currentFilter = catParam;
                    }

                    // 立即渲染
                    renderCategories();
                    renderSoftware();
                    setupEventListeners();
                    setupSideCats();
                });
            } catch (error) {
                console.error('数据加载失败:', error);
                showErrorState();
            }
        }

        // 初始化DOM缓存
        function initDOMCache() {
            domCache.categoryFilters = document.getElementById('categoryFilters');
            domCache.softwareGrid = document.getElementById('softwareGrid');
            domCache.searchInput = document.getElementById('searchInput');
            domCache.detailModal = document.getElementById('detailModal');
            domCache.modalIcon = document.getElementById('modalIcon');
            domCache.modalTitle = document.getElementById('modalTitle');
            domCache.modalCategory = document.getElementById('modalCategory');
            domCache.modalDescription = document.getElementById('modalDescription');
            domCache.modalDownloads = document.getElementById('modalDownloads');
        }

        // 显示加载状态
        function showLoadingState() {
            const container = document.getElementById('softwareGrid');
            container.innerHTML = `
                <div class="state-block">
                    <div class="state-icon">⏳</div>
                    <div class="state-text">数据正在加载，请稍后</div>
                </div>
            `;
        }

        // 隐藏加载状态
        function hideLoadingState() {
            // 数据加载完成后，渲染会自动替换加载状态
        }

        // 显示错误状态
        function showErrorState() {
            const container = document.getElementById('softwareGrid');
            container.innerHTML = `
                <div class="state-block">
                    <div class="state-icon">⚠️</div>
                    <div class="state-text">数据加载失败</div>
                    <button class="state-btn" onclick="init()">重新加载</button>
                </div>
            `;
        }

        // 渲染分类标签
        function renderCategories() {
            // 使用缓存的DOM引用
            const container = domCache.categoryFilters;

            // 渲染标签
            container.innerHTML = allCategories.map(category =>
                `<button class="filter-tab ${category === currentFilter ? 'active' : ''}"
                        onclick="filterByCategory('${category}')">${category}</button>`
            ).join('');
        }

        // 同步左侧边栏分类导航的选中态
        function syncSideCats() {
            document.querySelectorAll('#sideCats li').forEach(li => {
                li.classList.toggle('active', li.dataset.cat === currentFilter);
            });
        }

        // 左侧边栏分类导航：本页直接筛选，不跳转
        function setupSideCats() {
            syncSideCats();
            const sideCats = document.getElementById('sideCats');
            if (!sideCats) return;
            sideCats.addEventListener('click', e => {
                const a = e.target.closest('a');
                if (!a) return;
                const li = a.parentElement;
                if (!li || !li.dataset.cat) return;
                e.preventDefault();
                filterByCategory(li.dataset.cat);
                history.replaceState(null, '', li.dataset.cat === '全部'
                    ? 'index.html'
                    : 'index.html?cat=' + encodeURIComponent(li.dataset.cat));
            });
        }

        // 渲染软件卡片（支持分页）
        function renderSoftware() {
            if (isLoading) return;

            // 使用缓存的DOM引用
            const container = domCache.softwareGrid;

            // 合并筛选条件，单次遍历
            const filteredData = allSoftwareData.filter(item => {
                // 分类筛选
                const matchCategory = currentFilter === '全部' || item.category === currentFilter;

                // 搜索筛选
                let matchSearch = true;
                if (searchTerm) {
                    const term = searchTerm.toLowerCase();
                    matchSearch = item.name.toLowerCase().includes(term) ||
                                 item.description.toLowerCase().includes(term) ||
                                 item.id.toString() === term;
                }

                return matchCategory && matchSearch;
            });

            if (filteredData.length === 0) {
                container.innerHTML = `
                    <div class="no-results">
                        <div class="no-results-icon">🔍</div>
                        <div class="no-results-text">没有找到匹配的软件</div>
                    </div>
                `;
                return;
            }

            // 分页处理
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            const totalPages = Math.ceil(filteredData.length / pageSize);
            const hasMore = currentPage < totalPages;

            // 所有卡片合并进单一区块，行间用分割线分隔
            const block = document.createElement('div');
            block.className = 'software-block';

            pageData.forEach((software) => {
                const card = document.createElement('div');
                card.className = 'software-card';

                card.innerHTML = `
                    <div class="software-number">${software.index}</div>
                    <div class="card-content">
                        <div class="card-header">
                            <div class="app-icon">${software.icon || '📦'}</div>
                            <div class="app-info">
                                <div class="app-name">${software.name}</div>
                            </div>
                        </div>
                        <div class="app-description">${software.description}</div>
                    </div>
                    <div class="download-buttons">
                        ${Object.keys(software.downloadLinks || {}).length > 0 ?
                            `<button class="download-btn primary-btn" onclick="event.stopPropagation(); location.href='download.html?id=${software.id}'">
                                立即下载
                            </button>` : ''
                        }
                    </div>
                `;

                // 点击卡片主体也跳转到下载页面
                card.onclick = (e) => {
                    if (e.target.tagName !== 'BUTTON') {
                        location.href = `download.html?id=${software.id}`;
                    }
                };

                block.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(block);

            // 添加"加载更多"按钮
            if (hasMore) {
                const more = document.createElement('div');
                more.className = 'load-more-wrap';
                more.innerHTML = `
                    <button id="loadMoreBtn" onclick="loadMore()">
                        加载更多 (${currentPage}/${totalPages}页)
                    </button>
                `;
                container.appendChild(more);
            }

            // 显示统计信息
            const statsInfo = document.createElement('div');
            statsInfo.className = 'list-stats';
            statsInfo.textContent = `显示 ${start + 1}-${Math.min(end, filteredData.length)} 条，共 ${filteredData.length} 条`;
            container.appendChild(statsInfo);
        }

        // 加载更多数据
        function loadMore() {
            currentPage++;
            renderSoftware();
        }

        // 分类筛选
        function filterByCategory(category) {
            currentFilter = category;
            currentPage = 1; // 重置页码

            // 更新标签状态
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.classList.remove('active');
                if (tab.textContent === category) {
                    tab.classList.add('active');
                }
            });

            // 同步左侧边栏选中态
            syncSideCats();

            renderSoftware();

            // 滚动回列表顶部，便于查看筛选结果
            document.getElementById('softwareGrid').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // 显示详情
        function showDetail(softwareId) {
            // 确保数据已加载
            if (!allSoftwareData || allSoftwareData.length === 0) {
                console.error('数据未加载，无法显示详情');
                return;
            }

            const software = allSoftwareData.find(s => s.id == softwareId);
            if (!software) {
                console.error('未找到软件，ID:', softwareId);
                return;
            }

            document.getElementById('modalIcon').textContent = software.icon || '📦';
            document.getElementById('modalTitle').textContent = software.name;
            document.getElementById('modalCategory').textContent = software.category;
            document.getElementById('modalDescription').textContent = software.description;

            // 渲染下载链接
            const downloadsContainer = document.getElementById('modalDownloads');
            let html = '';

            // 立即下载
            if (software.downloadLinks && Object.keys(software.downloadLinks).length > 0) {
                html += '<div class="download-section"><div class="section-title">立即下载</div>';

                const platformNames = {
                    'baidu': '百度网盘',
                    'aliyun': '阿里云盘',
                    'lanzou': '蓝奏云',
                    'quark': '夸克网盘',
                    '123pan': '123云盘',
                    'xunlei': '迅雷网盘',
                    'cloudreve': '云盘下载'
                };

                Object.entries(software.downloadLinks).forEach(([platform, info]) => {
                    html += `
                        <div class="download-card">
                            <div class="platform-name">${platformNames[platform] || platform}</div>
                            <a href="${info.url}" target="_blank" class="download-link">
                                点击下载
                            </a>
                            ${info.code ? `
                                <div class="access-code">
                                    <span class="code-text">提取码: ${info.code}</span>
                                    <button class="copy-button" onclick="copyCode('${info.code}', this)">复制</button>
                                </div>
                            ` : ''}
                        </div>
                    `;
                });

                html += '</div>';
            }

            if (!html) {
                html = '<div class="download-section"><p style="color: var(--muted); text-align: center;">暂无下载链接</p></div>';
            }

            downloadsContainer.innerHTML = html;

            // 确保弹窗正确显示（Edge浏览器兼容性修复）
            const modal = document.getElementById('detailModal');
            if (modal) {
                modal.style.display = 'flex';
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';

                // 强制重绘，确保样式生效
                setTimeout(() => {
                    modal.offsetHeight;
                }, 10);
            } else {
                console.error('未找到弹窗元素');
            }
        }

        // 关闭弹窗
        function closeModal() {
            const modal = document.getElementById('detailModal');
            if (modal) {
                // 同时重置样式和CSS类（Edge浏览器兼容性修复）
                modal.style.display = 'none';
                modal.classList.remove('active');
                document.body.style.overflow = '';
            }
        }

        // 复制提取码
        function copyCode(code, button) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = '已复制';
                    setTimeout(() => button.textContent = originalText, 2000);
                });
            }
        }

        // 设置事件监听
        function setupEventListeners() {
            // 搜索功能（添加防抖）
            let searchTimeout;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => {
                    searchTerm = e.target.value;
                    currentPage = 1; // 重置页码
                    renderSoftware();
                }, 300); // 300ms防抖
            });

            // 点击弹窗外部关闭
            document.getElementById('detailModal').addEventListener('click', (e) => {
                if (e.target.id === 'detailModal') {
                    closeModal();
                }
            });

            // ESC 键关闭弹窗
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') {
                    closeModal();
                }
            });
        }

        // 页面加载完成后初始化
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
