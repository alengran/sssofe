    <script>
        // 复制提取码
        function copyCode(code, button) {
            if (navigator.clipboard) {
                navigator.clipboard.writeText(code).then(() => {
                    const originalText = button.textContent;
                    button.textContent = '已复制';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = originalText;
                        button.classList.remove('copied');
                    }, 2000);
                });
            } else {
                // 降级方案
                const textArea = document.createElement('textarea');
                textArea.value = code;
                textArea.style.position = 'fixed';
                textArea.style.left = '-999999px';
                document.body.appendChild(textArea);
                textArea.select();

                try {
                    document.execCommand('copy');
                    button.textContent = '已复制';
                    button.classList.add('copied');

                    setTimeout(() => {
                        button.textContent = '复制';
                        button.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('复制失败:', err);
                    alert('复制失败，请手动复制');
                }

                document.body.removeChild(textArea);
            }
        }

        // 初始化页面 - 加载对应软件的数据
        document.addEventListener('DOMContentLoaded', async function() {
            try {
                const softwareId = {{SOFTWARE_ID}};
                const data = await dataManager.loadData();
                const software = data.find(s => s.id === softwareId);

                if (!software) {
                    document.getElementById('softwareDetail').innerHTML = `
                        <div class="state-block">
                            <div class="state-icon">⚠️</div>
                            <div class="state-text">未找到软件</div>
                            <div>无法找到ID为 ${softwareId} 的软件信息</div>
                        </div>
                    `;
                    return;
                }

                const platformIcons = {
                    'baidu': '☁️',
                    'aliyun': '☁️',
                    'lanzou': '🔗',
                    'quark': '☁️',
                    '123pan': '☁️',
                    'xunlei': '⚡',
                    'cloudreve': '☁️'
                };

                const platformNames = {
                    'baidu': '百度网盘',
                    'aliyun': '阿里云盘',
                    'lanzou': '蓝奏云',
                    'quark': '夸克网盘',
                    '123pan': '123云盘',
                    'xunlei': '迅雷网盘',
                    'cloudreve': '云盘下载'
                };

                // 检查是否有下载链接
                const hasDownloads = software.downloadLinks && Object.keys(software.downloadLinks).length > 0;

                let downloadHTML = '';
                if (hasDownloads) {
                    Object.entries(software.downloadLinks).forEach(([platform, info]) => {
                        downloadHTML += `
                            <div class="download-card">
                                <div class="platform-name">
                                    <span class="platform-icon">${platformIcons[platform] || '🔗'}</span>
                                    ${platformNames[platform] || platform}
                                </div>
                                <a href="${info.url}" target="_blank" class="download-link">
                                    点击下载
                                </a>
                                ${info.code ? `
                                    <div class="access-code">
                                        <span class="code-text">提取码: <strong>${info.code}</strong></span>
                                        <button class="copy-button" onclick="copyCode('${info.code}', this)">复制</button>
                                    </div>
                                ` : ''}
                            </div>
                        `;
                    });
                } else {
                    downloadHTML = `
                        <div class="download-card" style="text-align: center; padding: 60px 40px;">
                            <div style="color: var(--muted);">暂无下载链接，请联系管理员获取</div>
                        </div>
                    `;
                }

                document.getElementById('softwareDetail').innerHTML = `
                    <div class="software-header">
                        <span class="software-icon-large">${software.icon || '📦'}</span>
                        <h1 class="software-title">${software.name}</h1>
                        <div class="software-category">${software.category}</div>
                        <p class="software-description">${software.description}</p>
                    </div>

                    <div class="download-section">
                        <h2 class="section-title">📥 下载地址</h2>
                        ${downloadHTML}
                    </div>
                `;

            } catch (error) {
                console.error('加载软件详情失败:', error);
                document.getElementById('softwareDetail').innerHTML = `
                    <div class="state-block">
                        <div class="state-icon">⚠️</div>
                        <div class="state-text">加载失败</div>
                        <div>加载数据时发生错误，请稍后重试</div>
                    </div>
                `;
            }
        });
