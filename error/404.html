<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>404 页面不存在 - 电脑小百科</title>
<link rel="stylesheet" href="../styles.css">
<style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(160deg, #f2f6fb 0%, #e6eefb 100%); margin: 0; }
    .error-wrap { text-align: center; padding: 40px 24px; max-width: 620px; width: 100%; }
    .error-code { font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: 6px;
        background: linear-gradient(135deg, #2b82e6, #1a63c4 60%, #144f9e);
        -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        margin-bottom: 8px; text-shadow: none; }
    .error-msg { font-size: 22px; font-weight: 700; color: #223a52; margin-bottom: 8px; }
    .error-hint { font-size: 14px; color: #7d8da0; margin-bottom: 28px; }
    .error-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-bottom: 36px; }
    .error-btn { display: inline-block; padding: 11px 30px; border-radius: 24px; text-decoration: none;
        font-size: 15px; font-weight: 600; transition: all .2s; }
    .error-btn.primary { background: linear-gradient(135deg, #2b82e6, #1a63c4); color: #fff;
        box-shadow: 0 4px 12px rgba(35, 120, 227, .3); }
    .error-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 18px rgba(35, 120, 227, .4); }
    .error-btn.ghost { background: #fff; color: #1a63c4; border: 1px solid #b8d4f2; }
    .error-btn.ghost:hover { background: #edf4fd; border-color: #1a63c4; }
    .error-links { font-size: 13px; color: #7d8da0; }
    .error-links a { color: #1a63c4; text-decoration: none; margin: 0 4px; }
    .error-links a:hover { text-decoration: underline; }
    .error-card { display: inline-block; background: #fff; border: 1px solid #e3eaf2; border-radius: 18px;
        padding: 44px 40px 36px; box-shadow: 0 8px 30px rgba(30, 80, 160, .08); }
    @media (max-width: 720px) { .error-code { font-size: 84px; } .error-msg { font-size: 18px; } .error-card { padding: 32px 20px 28px; } }
</style>
</head>
<body>
<div class="error-wrap">
    <div class="error-card">
        <div class="error-code">404</div>
        <div class="error-msg">抱歉，您访问的页面不存在或已被移除</div>
        <p class="error-hint">链接可能已失效，或地址输入有误，请检查后重试</p>
        <div class="error-actions">
            <a href="../index.html" class="error-btn primary">🏠 返回首页</a>
            <a href="../nav.html" class="error-btn ghost">🧭 网址导航</a>
        </div>
        <div class="error-links">
            常用入口：
            <a href="../download.html?id=1">软件下载</a>
            <a href="../contact.html">联系我们</a>
            <a href="../help.html">帮助中心</a>
        </div>
    </div>
</div>
</body>
</html>
